name: Collect market data
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run collect
      - uses: actions/upload-artifact@v4
        with:
          name: market-cache
          path: public/data/market.json
          retention-days: 7
          if-no-files-found: error
